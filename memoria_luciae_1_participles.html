</style></head><body>

<div id="topbar">
  <h1>Memoria Lūciae · I</h1>
  <span class="badge">Stage 23 — Participles</span>
  <span class="spacer"></span>
  <span id="score"></span>
  <button class="tb-btn" onclick="doPrint()">🖨 Print my work</button>
</div>
<div id="progwrap"><div id="prog"></div></div>

<div id="page"></div>
<div id="print-body"></div>

<script>
/* ═══ helpers ═══ */
const $ = id => document.getElementById(id);
const pg = () => $('page');
const pt = t => `<span class="pt">${t}</span>`;          /* participle highlight */
const sp = t => `<span class="sp">${t}</span>`;          /* speech */
const norm = s => s.toLowerCase().trim()
  .replace(/[āăá]/g,'a').replace(/[ēĕé]/g,'e').replace(/[īĭí]/g,'i')
  .replace(/[ōŏó]/g,'o').replace(/[ūŭú]/g,'u').replace(/[^a-z ]/g,'').replace(/\s+/g,' ');

/* ═══ episode vocabulary ═══ */
const VB = [
  ['Tarracō, Tarracōne','Tarraco, in Spain',0,'Tarrac'],
  ['Hispānia, -ae','Spain',0,'Hispan'],
  ['portus, -ūs','harbour',0,'port'],
  ['Claudia, -ae','the widow who took Lucia in',0,'Claudi'],
  ['Lūcia, -ae','of Pompeii',0,'Luci'],
  ['urna, -ae','jar (St 14)',0,'urna|urnae|urnam'],
  ['plēnus, -a, -um *','full of (+ abl.)',0,'plēn'],
  ['pōculum, -ī *','cup',0,'pōculum|pocul'],
  ['male *','badly',0,'male'],
  ['manus, manūs (f.) *','hand — 4th decl.',0,'manus|manum|manū'],
  ['sēcum *','with him / her',0,'sēcum'],
  ['iterum *','again',0,'iterum'],
  ['memoriā teneō','remember (St 22)',0,'memoriā'],
  ['frangō → frāctus','break → broken (St 17)',0,'frāct|frang'],
  ['-ns, -ntēs','…-ing  (PAP)',1,'ns |ntēs|ntem|nte '],
  ['-tus, -ta, -tum','having been …-ed  (PPP)',1,'tus |ta |tum |tae |tī '],
  ['-ūrus, -ūra','about to …  (FAP)',1,'ūr'],
];
function vocabBar(txt){
  const clean=(txt||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
  const rows = VB.filter(([l,d,n,st]) => st.split('|').some(x => clean.includes(x)));
  const use = rows.length ? rows : VB;
  return `<div class="vocab-bar"><h4>📌 On this page</h4>
    ${use.map(([l,d,n])=>`<div class="vb-row"><span class="vb-lat">${l}</span>${n?'<span class="vt-n">PTC</span>':''}<br><span class="vb-def">${d}</span></div>`).join('')}
    <div class="vb-note">Only words on this page are listed. <span class="vt-n" style="vertical-align:baseline">PTC</span> = today's grammar: the participle. <b>*</b> = not on your Stages 1–23 lists; glossed under the paragraph.</div></div>`;
}

/* ═══ STORY + QUESTIONS ═══
   question kinds — all self-checking:
     fill  : type the Latin from the text     → auto-marked
     spot  : click the right word             → auto-marked
     label : choose PAP / PPP / FAP           → auto-marked
     mc    : choose the best answer           → auto-marked
     write : type, then compare to a model    → self-marked
   ═══════════════════════════════════════ */

const SECTIONS = [
{
  title:'Pars I — In Portū',
  paras:[
    { html:`<p class="latin">
        ${'Lūcia in portū stābat, nāvēs '+pt('spectāns')+'. Tarracō urbs magna erat, turba mercātōrum et nautārum.'}
        ${'mercātōrēs '+pt('clāmantēs')+' per viās contendēbant; nautae fessī in nāvibus labōrābant.'}
      </p>`,
      glosses:[],
      qs:[
        {k:'spot', q:'Click the participle.', words:['Lūcia','in','portū','stābat','nāvēs','spectāns'], target:5,
         note:'spectāns — watching. A present participle ends -ns in the nominative, and describes somebody doing something right now.',
         hint:'Four words here are ordinary nouns. One is a verb with a person ending. The last one is neither.'},
        {k:'fill', q:'Complete from the text: <em>mercātōrēs ___________ per viās contendēbant.</em>',
         answer:'clāmantēs', hint:'It ends -ntēs, so it describes more than one person.',
         note:'clāmantēs — shouting. Plural, because the merchants are plural.'},
        {k:'mc', q:'<em>nāvēs spectāns</em> — who is doing the watching?',
         opts:['Lucia — spectāns describes her, and she is the subject.','The ships are watching.','Nobody; spectāns is the main verb.'],
         correct:0, ok:'Right. A participle always belongs to somebody. Find the person it describes and the sentence opens up.',
         err:'Not quite. spectāns is not the main verb — stābat is. So spectāns must be describing one of the people.'},
        {k:'write', q:'The harbour is full of people doing things. What is Lucia doing, and how is that different from everyone else?',
         min:25, look:['Lucia is standing still / only watching','the others are working, shouting, hurrying'],
         model:'Everyone else is in motion — clāmantēs, contendēbant, labōrābant. Lucia only stands and watches (stābat, spectāns). She is in the middle of a busy place and not part of it.'},
      ]},
  ]
},
{
  title:'Pars II — Nāvis ē Graeciā',
  paras:[
    { html:`<p class="latin">
        ${'in portū erat nāvis, ē Graeciā nūper '+pt('ducta')+'. mercēs ē nāve '+pt('portātae')+' in terrā manēbant:'}
        urnae vīnō plēnae*, frūmentum multum.
      </p>`,
      glosses:[['plēnae*','full of (plēnus, -a, -um + ablative)']],
      qs:[
        {k:'label', q:'<em>nāvis ē Graeciā nūper <b>ducta</b></em> — label the participle.',
         word:'ducta', opts:['PAP — leading','PPP — having been brought','FAP — about to lead'], correct:1,
         note:'PPP. The ship did not lead anything — it WAS led, brought across from Greece. -ta is the ending of a thing already done to something.',
         hint:'Did the ship do the leading, or did something happen to the ship?'},
        {k:'spot', q:'Click the other PPP in this paragraph.',
         words:['mercēs','ē','nāve','portātae','in','terrā','manēbant'], target:3,
         note:'portātae — having been carried off. It ends -ae because mercēs (goods) is feminine plural, so the participle matches it.',
         hint:'Look for a word ending -tae. It has to match a plural noun nearby.'},
        {k:'mc', q:'Why <em>portātae</em> and not <em>portātus</em>?',
         opts:['Because the goods are feminine and plural, and a participle matches the noun it describes.','Because it happened a long time ago.','Because it comes after a preposition.'],
         correct:0, ok:'Exactly. A participle dresses to match its noun — which is why it can be labelled like an adjective.',
         err:'Not that. Look at mercēs: what gender and number is it? The participle copies it.'},
        {k:'write', q:'Everything in this paragraph has already been done to it. List two things and say who did them.',
         min:25, look:['ducta / portātae named','the doer is never stated'],
         model:'The ship was brought (ducta) and the goods were carried off (portātae) — but the Latin never says by whom. Sailors, presumably. A PPP tells you something was done without telling you who did it.'},
      ]},
    { html:`<p class="latin">
        Lūcia urnam ${pt('frāctam')} vīdit — et subitō nihil aliud vidēre poterat.
      </p>`,
      glosses:[],
      qs:[
        {k:'fill', q:'Complete from the text: <em>Lūcia urnam ___________ vīdit.</em>',
         answer:'frāctam', hint:'It matches urnam — same gender, same case, same number.',
         note:'frāctam — broken. It ends -am because urnam does.'},
        {k:'write', q:'What happens to Lucia when she sees the broken jar?',
         min:20, look:['she stops seeing anything else','something from memory arrives'],
         model:'She cannot see anything else — nihil aliud vidēre poterat. Something about the broken jar takes her somewhere else. The story does not yet say where.'},
      ]},
  ],
  memoria:{
    lat:`vir pōculum* ${pt('tenēns')} — sed male* ${pt('tenēns')}.<br>manus* ${pt('frācta')}.<br>puella ${pt('rīdēns')}.<br>iānua ${pt('clausa')}.`,
    eng:'A man holding a cup — but holding it badly. A broken hand. A girl laughing. A door shut.',
    glosses:[['pōculum*','cup (pōculum, pōculī n.)'],['male*','badly'],['manus*','hand (manus, manūs f. — 4th declension)']],
    qs:[
      {k:'label', q:'<em>manus* <b>frācta</b></em> — label it.',
       word:'frācta', opts:['PAP — breaking','PPP — having been broken','FAP — about to break'], correct:1,
       note:'PPP. The hand did not break anything; it had been broken. Something happened to it, once, before this memory.',
       hint:'Same ending family as ducta and portātae in Pars II.'},
      {k:'spot', q:'Click the participle that is happening right now, not already finished.',
       words:['vir','pōculum','tenēns','manus','frācta','iānua','clausa'], target:2,
       note:'tenēns — holding. A PAP is live: the man is holding the cup at the moment she remembers.',
       hint:'-ns is now. -ta and -sa are already over.'},
      {k:'write', q:'Not one of these fragments is a full sentence. Why might a memory arrive in participles instead of sentences?',
       min:30, look:['participles give a picture without a full action','no subject, no time, no main verb'],
       model:'A participle gives you a picture but not a statement — no main verb, no time, nobody named. That is what a fragment of memory is: you can see it, but you cannot yet say what happened or when.'},
    ]
  }
},
{
  title:'Pars III — Domum',
  paras:[
    { html:`<p class="latin">
        Claudia manum Lūciae tenuit. ${sp('"quid vīdistī?"')}
        ${sp('"nihil,"')} Lūcia inquit. ${sp('"nesciō."')}
        Claudia, domum ${pt('reditūra')}, Lūciam sēcum* dūxit.
        sed Lūcia, iterum* ${pt('ventūra')}, nāvēs memoriā tenēbat.
      </p>`,
      glosses:[['sēcum*','with her'],['iterum*','again'],['memoriā teneō','to remember — literally, to hold with memory']],
      qs:[
        {k:'label', q:'<em>Claudia, domum <b>reditūra</b></em> — label it.',
         word:'reditūra', opts:['PAP — returning','PPP — having been returned','FAP — about to return'], correct:2,
         note:'FAP. -ūr- is the future participle: about to return, going to return. Claudia has not left yet.',
         hint:'Look for the letters -ūr- in the middle. That block always means "about to".'},
        {k:'fill', q:'Complete from the text: <em>Lūcia, iterum ___________, nāvēs memoriā tenēbat.</em>',
         answer:'ventūra', hint:'Another -ūr- word. It describes Lucia, so it ends -a.',
         note:'ventūra — about to come again. She has already decided to go back to the harbour.'},
        {k:'mc', q:'What does <em>ventūra</em> tell you that the rest of the sentence does not?',
         opts:['That Lucia will go back to the harbour, even though nobody says so out loud.','That Lucia has already been to the harbour many times.','That Lucia is leaving Tarraco.'],
         correct:0, ok:'Yes. The future participle smuggles in a plan. She tells Claudia nothing, and one word gives her away.',
         err:'Read the -ūr- again: it points forward, not backward. What has not happened yet?'},
        {k:'write', q:'Lucia tells Claudia <em>nihil</em> — nothing. Do you believe her? Use a Latin word from the paragraph in your answer.',
         min:30, look:['no — ventūra shows she means to return','memoriā tenēbat — she is still holding it'],
         model:'No. She says nihil, but ventūra says she is already planning to go back, and memoriā tenēbat says she is still holding the ships in her memory. The grammar contradicts her out loud.'},
      ]},
  ]
},
];

/* ═══ state ═══ */
const S = { sec:0, ans:{}, done:{}, fb:{}, pick:{}, right:0, asked:0, refl:0, reflTotal:0 };
SECTIONS.forEach((s,si)=>{
  s.paras.forEach((p,pi)=> p.qs.forEach((q,qi)=>{ if(q.k==='write') S.reflTotal++; }));
  if(s.memoria) s.memoria.qs.forEach(q=>{ if(q.k==='write') S.reflTotal++; });
});
const autoTotal = (()=>{ let n=0; SECTIONS.forEach(s=>{ s.paras.forEach(p=>p.qs.forEach(q=>{ if(q.k!=='write') n++; })); if(s.memoria) s.memoria.qs.forEach(q=>{ if(q.k!=='write') n++; }); }); return n; })();

function updateBar(){
  $('score').textContent = `✓ ${S.right}/${autoTotal} checked   ·   ✎ ${S.refl}/${S.reflTotal} written`;
  $('prog').style.width = Math.round(((S.right + S.refl)/(autoTotal+S.reflTotal))*100)+'%';
}

/* ═══ question rendering ═══ */
function qid(si,pi,qi){ return `q_${si}_${pi}_${qi}`; }

function optHTML(q,id,st){
  const pk=S.pick[id];
  return q.opts.map((o,i)=>{
    let c='opt';
    if(st!==undefined&&pk!==undefined){ if(i===pk) c+=(pk===q.correct?' ok':' no'); else if(i===q.correct&&pk!==q.correct) c+=' ok'; }
    return `<button class="${c}" id="${id}-o${i}" onclick="checkPick('${id}',${i})" ${st?'disabled':''}>${o}</button>`;
  }).join('');
}
function renderQ(q, id, n){
  const st = S.done[id];
  let body = '';
  if(q.k==='fill'){
    body = `<div class="q-row">
      <input class="ans" id="${id}-in" placeholder="Scrībe hīc…" value="${S.ans[id]||''}" ${st?'disabled':''}
        onkeydown="if(event.key==='Enter')checkFill('${id}')">
      <button class="btn" id="${id}-b" onclick="checkFill('${id}')" ${st?'disabled':''}>Check</button>
      ${q.hint?`<button class="btn ghost" onclick="showHint('${id}')">Hint</button>`:''}
    </div>`;
  } else if(q.k==='spot'){
    const pk = S.pick[id];
    body = `<div class="q-row">${q.words.map((w,i)=>{
      let c='chip'; if(st!==undefined&&pk!==undefined){ if(i===pk) c+= (pk===q.target?' ok':' no'); else if(i===q.target&&pk!==q.target) c+=' ok'; }
      return `<button class="${c}" id="${id}-w${i}" onclick="checkSpot('${id}',${i})" ${st?'disabled':''}>${w}</button>`;}).join('')}</div>
      ${q.hint?`<div class="q-row" style="margin-top:8px"><button class="btn ghost" onclick="showHint('${id}')">Hint</button></div>`:''}`;
  } else if(q.k==='label'){
    body = optHTML(q,id,st) + (q.hint?`<button class="btn ghost" onclick="showHint('${id}')">Hint</button>`:'');
  } else if(q.k==='mc'){
    body = optHTML(q,id,st);
  } else if(q.k==='write'){
    body = `<textarea class="ans" id="${id}-in" rows="3" placeholder="Write your answer, then check it…"
        oninput="gateWrite('${id}',${q.min})" ${st?'disabled':''}>${S.ans[id]||''}</textarea>
      <div class="q-row" style="margin-top:8px">
        <button class="btn" id="${id}-b" onclick="revealModel('${id}')" ${st||(S.ans[id]||'').trim().length<q.min?'disabled':''}>Compare with a model answer</button>
        <span style="font-size:.72rem;color:#9a7b55" id="${id}-cnt"></span>
      </div>`;
  }
  return `<div class="q ${st==='ok'?'done':st==='no'?'miss':''}" id="${id}">
    <div class="q-num">${n}</div>
    <div class="q-text">${q.q}</div>
    ${body}
    ${q.hint?`<div class="hintline" id="${id}-h">💡 ${q.hint}</div>`:''}
    <div class="fb${S.fb[id]?' show '+S.fb[id].cls:''}" id="${id}-f">${S.fb[id]?S.fb[id].html:''}</div>
  </div>`;
}

function findQ(id){
  const [,si,pi,qi] = id.split('_');
  const s = SECTIONS[+si];
  return pi === 'm' ? s.memoria.qs[+qi] : s.paras[+pi].qs[+qi];
}
function mark(id, ok, html, cls){
  const box=$(id), fb=$(id+'-f');
  const k = cls||(ok?'good':'bad');
  box.classList.add(ok?'done':'miss');
  fb.className='fb show '+k;
  fb.innerHTML=html;
  S.done[id]= ok?'ok':'no';
  S.fb[id]={html:html, cls:k};
  updateBar();
}

function checkFill(id){
  const q=findQ(id), el=$(id+'-in'); if(!el||S.done[id]) return;
  const v=el.value; if(!v.trim()) return;
  S.ans[id]=v;
  const ok = norm(v)===norm(q.answer) || (q.alts||[]).some(a=>norm(v)===norm(a));
  el.disabled=true; $(id+'-b').disabled=true;
  S.asked++; if(ok) S.right++;
  mark(id, ok, ok ? `<b>Optimē!</b> ${q.note}`
    : `Not the word. The text has <b><em>${q.answer}</em></b>. ${q.note}`);
}
function checkSpot(id, i){
  const q=findQ(id); if(S.done[id]) return;
  const ok = i===q.target;
  S.pick[id]=i;
  q.words.forEach((w,j)=>{ const b=$(`${id}-w${j}`); if(b) b.disabled=true; });
  $(`${id}-w${i}`).classList.add(ok?'ok':'no');
  if(!ok) $(`${id}-w${q.target}`).classList.add('ok');
  S.asked++; if(ok) S.right++;
  mark(id, ok, (ok?'<b>Optimē!</b> ':'<b>The word is marked green.</b> ')+q.note);
}
function checkPick(id, i){
  const q=findQ(id); if(S.done[id]) return;
  const ok = i===q.correct;
  S.pick[id]=i;
  q.opts.forEach((o,j)=>{ const b=$(`${id}-o${j}`); if(b) b.disabled=true; });
  $(`${id}-o${i}`).classList.add(ok?'ok':'no');
  if(!ok) $(`${id}-o${q.correct}`).classList.add('ok');
  S.asked++; if(ok) S.right++;
  mark(id, ok, ok ? `<b>Optimē!</b> ${q.ok||q.note}` : `${q.err||''} ${q.note||''}`);
}
function gateWrite(id, min){
  const el=$(id+'-in'), b=$(id+'-b'), c=$(id+'-cnt');
  S.ans[id]=el.value;
  const n=el.value.trim().length;
  b.disabled = n < min;
  c.textContent = n<min ? `${n} / ${min} characters — write your own answer first` : 'ready';
}
function revealModel(id){
  const q=findQ(id); if(S.done[id]) return;
  $(id+'-in').disabled=true; $(id+'-b').disabled=true;
  S.refl++;
  const list=(q.look||[]).map((l,i)=>`<li><input type="checkbox" id="${id}-c${i}"> ${l}</li>`).join('');
  mark(id, true, `<span class="mlabel">A model answer — yours does not have to match the words</span>${q.model}
    ${list?`<div style="margin-top:9px;font-size:.78rem;font-weight:700">Tick what your answer already had:</div><ul class="checklist">${list}</ul>`:''}`, 'model');
}
function showHint(id){ $(id+'-h').classList.add('show'); }

/* ═══ section rendering ═══ */
function renderSection(i){
  S.sec=i;
  const s=SECTIONS[i];
  const allTxt = s.paras.map(p=>p.html).join(' ') + (s.memoria?s.memoria.lat:'');
  let n=0;
  const parts = s.paras.map((p,pi)=>`
    ${p.html}
    ${p.glosses && p.glosses.length ? `<div class="glosses">${p.glosses.map(([k,v])=>`<b>${k}</b> = ${v}`).join(' &nbsp;|&nbsp; ')}</div>`:''}
    <div class="qb-h">Check your reading</div>
    ${p.qs.map((q,qi)=>renderQ(q, qid(i,pi,qi), 'Q'+(++n))).join('')}
  `).join('');

  const mem = s.memoria ? `
    <div class="memoria"><h4>✦ Memoria</h4>
      <p>${s.memoria.lat}</p>
      <p class="mem-eng">${s.memoria.eng}</p>
      ${s.memoria.glosses && s.memoria.glosses.length ? `<div class="glosses" style="margin-top:10px">${s.memoria.glosses.map(([k,v])=>`<b>${k}</b> = ${v}`).join(' &nbsp;|&nbsp; ')}</div>`:''}</div>
    <div class="qb-h">The fragments</div>
    ${s.memoria.qs.map((q,qi)=>renderQ(q, qid(i,'m',qi), 'Q'+(++n))).join('')}` : '';

  pg().innerHTML = `
  <div class="layout">
    <div class="vocab-col">${vocabBar(allTxt)}</div>
    <div>
      <div class="card">
        <div class="scene-label">📖 ${s.title}</div>
        ${parts}
        ${mem}
      </div>
      <div class="navbar">
        <div class="secnav">
          <button onclick="renderHome()">⌂</button>
          ${SECTIONS.map((x,j)=>`<button class="${j===i?'cur':''}${secDone(j)?' ok':''}" onclick="renderSection(${j})">${j+1}</button>`).join('')}
        </div>
        <div>
          ${i>0?`<button class="btn ghost" onclick="renderSection(${i-1})">◀ Back</button> `:''}
          ${i<SECTIONS.length-1?`<button class="btn" onclick="renderSection(${i+1})">Next — ${SECTIONS[i+1].title.split('—')[1].trim()} ▶</button>`
            :`<button class="btn" onclick="renderEnd()">Fīnis ▶</button>`}
        </div>
      </div>
    </div>
  </div>`;
  window.scrollTo(0,0);
  updateBar();
}
function secDone(j){
  const s=SECTIONS[j]; let all=true;
  s.paras.forEach((p,pi)=>p.qs.forEach((q,qi)=>{ if(!S.done[qid(j,pi,qi)]) all=false; }));
  if(s.memoria) s.memoria.qs.forEach((q,qi)=>{ if(!S.done[qid(j,'m',qi)]) all=false; });
  return all;
}

function renderHome(){
  pg().innerHTML=`<div class="home">
    <h2>Memoria Lūciae</h2>
    <div class="sub">I — In Portū · a reader for Stage 23</div>
    <div class="home-card">
      <div class="how">
        <p style="margin-top:0">Lucia lives in Tarraco, in Spain, in the house of a widow named Claudia.
        She is safe, she is useful, and she watches ships. This is the first of ten stories.</p>
        <p><b>Every word is Stage 1–22 vocabulary.</b> The only new thing is the <b>participle</b>.</p>
      </div>
    </div>
    <div class="home-card">
      <div class="scene-label">What a participle is</div>
      <div class="how">
        <p>A participle is a verb wearing an adjective's clothes. It describes somebody, and it tells you
        <b>when</b> their action sits relative to the main verb.</p>
        <div class="ex-sent"><em>nāvēs <b>spectāns</b></em> — watching the ships &nbsp;·&nbsp; <b>PAP</b>, happening now
          <span class="eng">-ns  ·  -ntēs in the plural</span></div>
        <div class="ex-sent"><em>manus <b>frācta</b></em> — a broken hand &nbsp;·&nbsp; <b>PPP</b>, already done to it
          <span class="eng">-tus, -ta, -tum  ·  matches its noun like any adjective</span></div>
        <div class="ex-sent"><em>domum <b>reditūra</b></em> — about to go home &nbsp;·&nbsp; <b>FAP</b>, not yet
          <span class="eng">look for the -ūr- block in the middle</span></div>
        <table class="vt"><tr><th>Label</th><th>Ending</th><th>When</th></tr>
          <tr><td><b>PAP</b></td><td>-ns / -ntēs</td><td>…-ing, right now</td></tr>
          <tr><td><b>PPP</b></td><td>-tus / -ta / -tum</td><td>having been …-ed, already</td></tr>
          <tr><td><b>FAP</b></td><td>-ūrus / -ūra</td><td>about to …, not yet</td></tr></table>
        <p>Every participle belongs to somebody. When you meet one, find the noun it describes and draw
        an arrow to it in your head.</p>
      </div>
    </div>
    <div class="home-card">
      <div class="scene-label">How this reader works</div>
      <div class="how">
        <p>You are reading on your own, so every question checks itself.</p>
        <p><b>Clicking, typing a Latin word, and choosing a label</b> are marked the moment you answer,
        with an explanation either way — a wrong answer tells you more than a right one, so guess honestly.
        Stuck? Most of them have a <b>Hint</b> that is one step short of the answer.</p>
        <p><b>Questions that ask you to explain</b> cannot be marked by a machine. Write yours first —
        the Compare button stays locked until you do — then read a model answer and tick off what you
        already had. Different words are fine. Missing ideas are the thing to notice.</p>
        <p>The bar at the top tracks both. When you are done, <b>Print my work</b> gives you your answers
        beside the model answers.</p>
      </div>
      <div style="text-align:center;margin-top:18px"><button class="btn" onclick="renderSection(0)">Incipe — begin ▶</button></div>
    </div>
  </div>`;
  window.scrollTo(0,0);
  updateBar();
}

function renderEnd(){
  const pct = autoTotal? Math.round(S.right/autoTotal*100):0;
  pg().innerHTML=`<div class="home">
    <h2>Fīnis — Pars I</h2>
    <div class="sub">Lucia said nothing, and one word gave her away.</div>
    <div class="home-card">
      <div class="how">
        <p style="margin-top:0"><b>Checked answers:</b> ${S.right} of ${autoTotal} right (${pct}%)<br>
        <b>Written answers:</b> ${S.refl} of ${S.reflTotal} compared with a model</p>
        <p>Participles to carry forward: <em>spectāns, clāmantēs</em> (PAP) · <em>vecta, portātae,
        frāctam, frācta, clausa</em> (PPP) · <em>reditūra, ventūra</em> (FAP).</p>
        <p>Keep the Memoria in mind. Four fragments, no sentence, and one of them is the key to
        everything that happens in Italy.</p>
      </div>
      <div style="text-align:center;margin-top:16px">
        <button class="btn" onclick="doPrint()">🖨 Print my work</button>
        <button class="btn ghost" onclick="renderSection(0)">Read again</button>
      </div>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ═══ print ═══ */
function buildPrint(){
  const strip = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); };
  let out = `<p class="pw-h">Memoria Lūciae — I · In Portū</p>
    <p class="pw-sub">Stage 23 · Participles (PAP / PPP / FAP) · vocabulary from Stages 1–22<br>
    Checked: ${S.right}/${autoTotal} right &nbsp;·&nbsp; Written: ${S.refl}/${S.reflTotal}</p>`;
  SECTIONS.forEach((s,si)=>{
    out += `<p class="pw-sec">${s.title}</p>`;
    s.paras.forEach((p,pi)=>{
      out += `<p class="pw-para">${strip(p.html)}</p>`;
      p.qs.forEach((q,qi)=> out += printQ(q, qid(si,pi,qi)) );
    });
    if(s.memoria){
      out += `<div class="pw-mem">${strip(s.memoria.lat)}<br><span style="font-style:normal;font-size:8.5pt">${s.memoria.eng}</span></div>`;
      s.memoria.qs.forEach((q,qi)=> out += printQ(q, qid(si,'m',qi)) );
    }
  });
  return out;
}
function printQ(q,id){
  const strip = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent.trim(); };
  let mine='', model='';
  if(q.k==='write'){ mine = S.ans[id]||'(not answered)'; model = q.model; }
  else if(q.k==='fill'){ mine = S.ans[id]||'(not answered)'; model = q.answer+' — '+strip(q.note); }
  else if(q.k==='spot'){ mine = S.done[id]==='ok'?'correct':S.done[id]==='no'?'incorrect':'(not answered)'; model = q.words[q.target]+' — '+strip(q.note); }
  else { mine = S.done[id]==='ok'?'correct':S.done[id]==='no'?'incorrect':'(not answered)'; model = strip(q.opts[q.correct]); }
  return `<div class="pw-q"><div class="pw-qt">${strip(q.q)}</div>
    <div class="pw-mine">${mine}</div>
    <div class="pw-model">${model}</div></div>`;
}
function doPrint(){ $('print-body').innerHTML = buildPrint(); window.print(); }

renderHome();
</script>
</body></html>
